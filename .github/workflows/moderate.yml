name: Withdraw or restore plugin
on:
  workflow_dispatch:
    inputs:
      plugin_name:
        description: 插件名称（如 game_news）
        type: string
        required: true
      action:
        description: withdraw 下架 / restore 恢复
        type: choice
        required: true
        options:
          - withdraw
          - restore
      reason:
        description: 操作原因（必填，最多 1000 字符）
        type: string
        required: true
permissions:
  contents: read
jobs:
  moderate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: market-index-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify maintainer and publish availability change
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m market.moderation
