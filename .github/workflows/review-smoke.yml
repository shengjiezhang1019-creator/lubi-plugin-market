name: AI review smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Review public example with configured AI service
        env:
          REVIEW_API_BASE: ${{ vars.REVIEW_API_BASE }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: python -m market.smoke --work .work/ai-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-smoke
          path: |
            .work/ai-smoke/validation.json
            .work/ai-smoke/ai-review.json
          if-no-files-found: warn
          retention-days: 7
