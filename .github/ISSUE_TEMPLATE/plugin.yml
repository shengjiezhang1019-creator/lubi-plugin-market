name: 添加插件或发布版本
description: 提交固定 Release，等待检查、AI 报告和维护者批准
title: "[Plugin] "
body:
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称
      description: 与 _manifest.json 的 name 一致
      placeholder: weather_plugin
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库
      description: 公开 HTTPS 仓库根地址
      placeholder: https://github.com/owner/weather-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release 标签
      description: 必须已公开发布正式 Release
      placeholder: v1.0.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        可从下方展开选择插件使用的 Hook（支持多选）。[查看完整 Hook 契约与示例](https://github.com/shengjiezhang1019-creator/lubi-plugin-market/blob/main/docs/hook-contracts.md)。
        **勾选仅供审核说明，不会创建或修改绑定；实际接入以插件代码和宿主加载校验为准。**
        清单是宿主公开契约快照，目标宿主是否支持请以安装端为准。
  - type: dropdown
    id: hooks
    attributes:
      label: 使用的 Hook
      description: 选择代码中实际绑定的 Hook，可多选；此项可留空。
      multiple: true
      options:
        - "AFTER_DANMAKU_REPLY_GENERATION — 弹幕回复生成后的处理"
        - "AFTER_GIFT_SIGNAL_TEXT_GENERATION — 礼物信号文案生成后的处理"
        - "AFTER_SPECULATIVE_REPLY_GENERATION — 推测回复生成后的处理"
        - "BARRAGE_PROCESSING — 弹幕筛选与处理"
        - "BARRAGE_STEP_WEB_SEARCH — 弹幕思考阶段的联网搜索"
        - "BEFORE_DEEP_THINKING — 深度思考前的规划接入"
        - "BEFORE_REPLY_CONTEXT — 回复前补充参考资料"
        - "DOUYIN_LIVE_CONTROL — 抖音直播连接控制"
        - "KNOWLEDGE_QUERY — 本地知识查询"
        - "MEMORY_TERM_LOOKUP — 记忆术语查询"
        - "MESSAGE_INGRESS — 标准消息接入"
        - "PFC_CONTEXT_GATHERING — 向 PFC 规划模型提供上下文工具"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 外部服务、特殊依赖与已知限制。不要填写真实密钥。
