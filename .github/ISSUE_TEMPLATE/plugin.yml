name: 添加插件或发布版本
description: 提交固定 Release，等待检查、AI 报告和维护者批准
title: "[Plugin] "
body:
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称
      description: 与 _manifest.json 的 name 一致
      placeholder: weather_plugin
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库
      description: 公开 HTTPS 仓库根地址
      placeholder: https://github.com/owner/weather-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release 标签
      description: 必须已公开发布正式 Release
      placeholder: v1.0.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        请选择插件代码中实际使用的 Hook，可多选。
        [查看 Hook 流程图、作用与输入输出说明](https://github.com/shengjiezhang1019-creator/lubi-plugin-market/blob/main/docs/hook-contracts.md)。

        市场会与源码中的绑定声明进行静态对比，差异或无法确认的情况提示人工核实。
        此处选择不会自动建立绑定，实际挂载以插件代码及宿主加载结果为准。
  - type: checkboxes
    id: hooks
    attributes:
      label: 使用的 Hook
      description: 请选择代码中实际绑定的 Hook，至少选择一项，可多选。
      options:
        - label: "BARRAGE_PROCESSING — 筛选出本轮要关注的弹幕"
        - label: "BARRAGE_STEP_WEB_SEARCH — 提供弹幕检索步骤的联网摘要"
        - label: "BEFORE_REPLY_CONTEXT — 向回复 Prompt 追加参考资料"
        - label: "KNOWLEDGE_QUERY — 查询知识并提供后续模型参考资料"
        - label: "PFC_CONTEXT_GATHERING — 供 PFC 模型选择并调用插件工具"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 外部服务、特殊依赖与已知限制。不要填写真实密钥。
