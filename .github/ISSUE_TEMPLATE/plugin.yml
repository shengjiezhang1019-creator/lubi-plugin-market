name: 添加插件或发布版本
description: 提交固定 Release，等待检查、AI 报告和维护者批准
title: "[Plugin] "
body:
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称
      description: 与 _manifest.json 的 name 一致
      placeholder: weather_plugin
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库
      description: 公开 HTTPS 仓库根地址
      placeholder: https://github.com/owner/weather-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release 标签
      description: 必须已公开发布正式 Release
      placeholder: v1.0.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        可从下方展开选择插件使用的 Hook（支持多选）。[查看完整 Hook 契约与示例](https://github.com/shengjiezhang1019-creator/lubi-plugin-market/blob/main/docs/hook-contracts.md)。
        **勾选仅供审核说明，不会创建或修改绑定；实际接入以插件代码和宿主加载校验为准。**
        清单是宿主公开契约快照，目标宿主是否支持请以安装端为准。

        **先按需要选择接入类型：**

        | 类型 | 插件能做什么 | 典型 Hook |
        | --- | --- | --- |
        | 消息处理 | 转换消息、筛选进入规划的消息 | MESSAGE_INGRESS、BARRAGE_PROCESSING |
        | 上下文补充 | 返回资料，由宿主放入后续上下文 | BEFORE_REPLY_CONTEXT、KNOWLEDGE_QUERY |
        | 回复与语义处理 | 改写候选正文、事件描述，或补充语义结果 | AFTER_*、MEMORY_TERM_LOOKUP |
        | 状态控制 | 管理直播来源与场次 | DOUYIN_LIVE_CONTROL |
        | 模型工具 | 由模型选择工具，结果回填模型 | PFC_CONTEXT_GATHERING |

        不确定字段怎么写？请查看上方完整契约中的「传入 → 返回 → 下游去向」及示例。
  - type: dropdown
    id: hooks
    attributes:
      label: 使用的 Hook
      description: 请选择代码中实际绑定的 Hook，至少选择一项，可多选。
      multiple: true
      options:
        - "AFTER_DANMAKU_REPLY_GENERATION — 发送前保留或替换弹幕回复正文"
        - "AFTER_GIFT_SIGNAL_TEXT_GENERATION — 保留或替换礼物情绪事件描述"
        - "AFTER_SPECULATIVE_REPLY_GENERATION — 放行前保留或替换投机回复正文"
        - "BARRAGE_PROCESSING — 筛选消息并决定是否进入回复规划"
        - "BARRAGE_STEP_WEB_SEARCH — 提供弹幕检索步骤的联网摘要"
        - "BEFORE_DEEP_THINKING — 提供深度执行的事实与回答约束"
        - "BEFORE_REPLY_CONTEXT — 向回复 Prompt 追加参考资料"
        - "DOUYIN_LIVE_CONTROL — 启动、停止或查询抖音直播来源"
        - "KNOWLEDGE_QUERY — 查询知识并提供后续模型参考资料"
        - "MEMORY_TERM_LOOKUP — 查询术语并补充记忆语义结果"
        - "MESSAGE_INGRESS — 转换或拒绝外部平台消息"
        - "PFC_CONTEXT_GATHERING — 供 PFC 模型选择并调用插件工具"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 外部服务、特殊依赖与已知限制。不要填写真实密钥。
